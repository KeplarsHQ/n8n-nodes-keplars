name: Publish to npm

on:
  repository_dispatch:
    types: [publish]

jobs:
  publish:
    name: Publish n8n-nodes-keplars to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=peer --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Setup Node for publish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish --access public --provenance
